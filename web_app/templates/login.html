<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0c100f">
    <title>Login - Henvironment</title>
    <style>
        :root { color-scheme: dark; }
        *, *::before, *::after { box-sizing: border-box; }
        body {
            margin: 0;
            background-color: #0c100f !important;
            color: #e6ece9;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            font-size: 1rem;
            line-height: 1.5;
        }
        .d-flex { display: flex; }
        .align-items-center { align-items: center; }
        .vh-100 { min-height: 100vh; }
        .container { width: 100%; max-width: 1140px; margin: 0 auto; padding: 0 16px; }
        .row { display: flex; flex-wrap: wrap; }
        .justify-content-center { justify-content: center; }
        .col-md-4 { width: 100%; max-width: 380px; }
        .card {
            background-color: #131b18;
            border: 1px solid #202d27;
            border-radius: 14px;
            color: #e6ece9;
        }
        .card-body { padding: 1.5rem; }
        .text-center { text-align: center; }
        .mb-4 { margin: 0 0 1.5rem; font-size: 1.5rem; font-weight: 500; line-height: 1.2; }
        .mb-3 { margin-bottom: 1rem; }
        .form-label {
            display: inline-block;
            margin-bottom: 0.5rem;
            color: #84968e;
        }
        .form-control {
            display: block;
            width: 100%;
            padding: 0.375rem 0.75rem;
            font-size: 1rem;
            line-height: 1.5;
            background-color: #1a2521;
            border: 1px solid #2c3e37;
            border-radius: 0.375rem;
            color: #e6ece9;
            outline: none;
            transition: border-color .15s ease-in-out, box-shadow .15s ease-in-out;
        }
        .form-control:focus {
            background-color: #1a2521;
            border-color: #10b981;
            box-shadow: 0 0 0 3px rgb(52 211 153 / 22%);
            color: #e6ece9;
        }
        .btn {
            display: inline-block;
            padding: 0.45rem 0.75rem;
            font-size: 1rem;
            font-weight: 400;
            line-height: 1.5;
            text-align: center;
            border: 1px solid transparent;
            border-radius: 0.375rem;
            color: #fff;
            cursor: pointer;
            transition: background-color .15s ease-in-out, border-color .15s ease-in-out;
        }
        .w-100 { width: 100%; }
        .btn-primary {
            background-color: #10b981;
            border-color: #10b981;
        }
        .btn-primary:hover, .btn-primary:focus {
            background-color: #34d399;
            border-color: #34d399;
        }
        .alert {
            padding: 0.75rem 1rem;
            margin-bottom: 1rem;
            border: 1px solid #842029;
            border-radius: 0.375rem;
            background-color: #2c0b0e;
            color: #ea868f;
        }
    </style>
</head>
<body class="d-flex align-items-center vh-100">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h4 class="text-center mb-4">Henvironment</h4>
                        {% if error %}
                          <div class="alert alert-danger" role="alert">{{ error }}</div>
                        {% endif %}
                        
                        {% with messages = get_flashed_messages(with_categories=true) %}
                          {% if messages %}
                            {% for category, message in messages %}
                              <div class="alert alert-{{ category }}">{{ message }}</div>
                            {% endfor %}
                          {% endif %}
                        {% endwith %}

                        <form method="POST">
                            <div class="mb-3">
                                <label class="form-label">Username</label>
                                <input type="text" name="username" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Password</label>
                                <input type="password" name="password" class="form-control" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Login</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
