services:
  # 1. The Database Container
  postgres_db:
    image: postgres:15-alpine
    container_name: postgres_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: notsosecretpass
      POSTGRES_DB: air_quality
    ports:
      - "5432:5432"
    volumes:
      - ./db_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d air_quality"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # 2. The MQTT Broker Container
  mqtt_broker:
    image: eclipse-mosquitto:latest
    container_name: mqtt_broker
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
    restart: unless-stopped

  # 3. The Data Ingestion Container (Builds from your folder)
  ingestion:
    build: ./ingestion
    container_name: data_ingestion
    depends_on:
      postgres_db:
        condition: service_healthy
      mqtt_broker:
        condition: service_started
    restart: unless-stopped

  # 5. The Analytics Dashboard (Builds from your folder)
  web_dashboard:
    build: ./web_app
    container_name: web_dashboard
    ports:
      - "5000:5000"
    environment:
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:-}
    volumes:
      - ./add_users.py:/app/add_users.py:ro
    depends_on:
      postgres_db:
        condition: service_healthy
    restart: unless-stopped
